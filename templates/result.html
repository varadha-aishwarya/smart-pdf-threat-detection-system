<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Smart PDF Threat Detection System Using Machine Learning</title>
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        
        <!-- Favicon -->
        <link href="/static/img/favicon.ico" rel="icon">

        <!-- Google Font -->
        <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"> 
        
        <!-- CSS Libraries -->
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
        
        <!-- Template Stylesheet -->
        <link href="/static/css/style.css" rel="stylesheet">
    </head>

    <body>
        <!-- Top Bar Start -->
        <div class="top-bar">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-12 col-md-12">
                        <div class="logo">
                            <a href="index.html">
                                <h4>Smart PDF Threat Detection System Using Machine Learning</h4>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Top Bar End -->

        <!-- Nav Bar Start -->
        <div class="nav-bar">
            <div class="container">
                <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
                    <a href="#" class="navbar-brand">MENU</a>
                    <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
                        <div class="navbar-nav mr-auto">
                            <a href="{{url_for('Algo')}}" class="nav-item nav-link ">Algorithm Performance</a>
                            <a href="{{url_for('pred')}}" class="nav-item nav-link active">Prediction</a>
                            <a href="{{url_for('index')}}" class="nav-item nav-link">Logout</a>        
                        </div>
                    </div>
                </nav>
            </div>
        </div>
        <!-- Nav Bar End -->

        <div class="container mt-5 mb-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card text-center shadow-lg" style="border-radius: 15px; overflow: hidden; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.2);">
                        <div class="card-header" style="background: #E81C2E; color: white;">
                            <h3>Prediction Result</h3>
                        </div>
                        <div class="card-body py-5">
                            {% if msg == 'Benign' %}
                                <h1 style="color: #28a745; font-size: 50px;"><i class="fas fa-check-circle"></i></h1>
                                <h2 style="color: white; margin-top: 20px;">The uploaded PDF is <b>{{msg}}</b></h2>
                            {% else %}
                                <h1 style="color: #dc3545; font-size: 50px;"><i class="fas fa-exclamation-triangle"></i></h1>
                                <h2 style="color: white; margin-top: 20px;">The uploaded PDF is <b style="color: #dc3545;">{{msg}}</b></h2>
                            {% endif %}
                            
                            <a href="{{url_for('pred')}}" class="btn btn-custom mt-4">Predict Another File</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Start -->
        <div class="footer">
            <center>
                <div class="container">
                    <div class="row">
                        <div class="col-12">
                            <div class="footer-contact">      
                            </div>
                        </div>
                    </div>
                </div> 
            </center>
        </div>
        <!-- Footer End -->
        
        <!-- JavaScript Libraries -->
        <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
        
        <!-- Template Javascript -->
        <script src="/static/js/main.js"></script>
    </body>
</html>
